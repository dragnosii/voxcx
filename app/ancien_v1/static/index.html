<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoxCX · Écoute client</title>
<script>
  // le thème est appliqué avant l'affichage pour éviter un flash
  try {
    var t = localStorage.getItem('voxcx_theme');
    if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="mk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16l5-6 4 4 7-9"/></svg></div>
      <div><div class="nm">VoxCX</div><div class="sb">Écoute client · IA</div></div>
    </div>
    <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
    <div class="mode">
      <div class="t">Mode IA</div>
      <div class="seg" id="seg-mode"><button data-m="local">Local</button><button data-m="en ligne">En ligne</button></div>
      <div class="n" id="mode-note"></div>
    </div>
  </aside>
  <main class="main"><div class="wrap" id="main"></div></main>
</div>
<div id="portail"></div>
<script src="/static/core.js"></script>
<script src="/static/pages.js"></script>
</body>
</html>
